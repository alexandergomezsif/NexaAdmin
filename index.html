<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nexa ERP - Sistema Administrativo Integral Multiempresa para Pymes Colombianas">
  <title>NexaAdmin ERP</title>

  <!-- PWA: Manifiesto e Iconos -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0071e3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NexaAdmin">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">

  <!-- Hojas de Estilo Modulares -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body class="dark-mode">

  <!-- Overlay para cierre de sidebar en dispositivos móviles -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div id="app-root">
    
    <!-- ====================================================================
         SIDEBAR LATERAL MODULAR (20 MÓDULOS EN GRUPOS FUNCIONALES)
         ==================================================================== -->
        <aside class="app-sidebar" id="app-sidebar" style="background: var(--bg-sidebar); border-right: 1px solid var(--border-color); width: 250px;">
      
      <!-- Marca del desarrollador del software (NEXA CORP). La empresa activa se muestra en la barra superior. -->
      <div class="sidebar-brand sidebar-brand-nexa">
        <img src="icons/nexa-corp-light.png" alt="NEXA Corporación S.A.S" class="nexa-logo nexa-logo-light">
        <img src="icons/nexa-corp-dark.png" alt="NEXA Corporación S.A.S" class="nexa-logo nexa-logo-dark">
        <div class="nexa-logo-caption">ERP &amp; POS</div>
      </div>

      <!-- Menú de Navegación por Módulos (5 Macro-Secciones con Cajas de Icono) -->
      <nav class="sidebar-nav" style="padding: 16px 12px; display: flex; flex-direction: column; gap: 6px;">
        <a class="nav-item active" href="#sales-pos" data-route="sales-pos" title="Punto de Venta Mostrador y Facturación">
          <div class="nav-icon-box">🛒</div>
          <span>Ventas POS</span>
        </a>
        <a class="nav-item" href="#inventory" data-route="inventory" title="Catálogo de Productos, Kardex y Fórmulas">
          <div class="nav-icon-box">📦</div>
          <span>Inventario & Planta</span>
        </a>
        <a class="nav-item" href="#cash" data-route="cash" title="Caja, Compras, Gastos y Cartera">
          <div class="nav-icon-box">💵</div>
          <span>Finanzas & Cartera</span>
        </a>
        <a class="nav-item" href="#clients" data-route="clients" title="Ficha 360° de Clientes y Red Freelance">
          <div class="nav-icon-box">👥</div>
          <span>Clientes & Vendedores</span>
        </a>
        <a class="nav-item" href="#settings" data-route="settings" title="Configuración General, Usuarios y Respaldo">
          <div class="nav-icon-box">⚙️</div>
          <span>Configuración</span>
        </a>
      </nav>

      <!-- Pie del Sidebar con Estado del Sistema -->
      <div class="sidebar-footer" style="padding: 12px 18px; border-top: 1px solid var(--border-color);">
        <div class="d-flex items-center justify-between">
          <div class="d-flex items-center gap-2">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #4FC58A; box-shadow: 0 0 8px #4FC58A;"></div>
            <span style="font-size: 11px; color: var(--text-secondary); font-weight: 600;" title="La información se guarda solo en este navegador">Datos locales</span>
          </div>
          <span style="font-size: 10px; color: var(--text-secondary); font-family: monospace;">v3.4.0</span>
        </div>
      </div>
    </aside>

    <!-- ====================================================================
         ÁREA PRINCIPAL CON TOPBAR Y CONTENEDOR DE VISTAS
         ==================================================================== -->
    <main class="app-main">
      
      <!-- BARRA SUPERIOR (TOPBAR) -->
      <header class="app-topbar">
        
        <div class="topbar-left">
          <!-- Botón hamburguesa móvil -->
          <button class="btn-sidebar-toggle" id="btn-toggle-sidebar" aria-label="Menú">
            ☰
          </button>

          <!-- Conmutador Rápido de Empresa Multi-tenant -->
          <div class="tenant-selector" id="topbar-tenant-selector" title="Clic para cambiar de empresa">
            <span id="topbar-brand-icon" style="display: inline-flex; align-items: center; justify-content: center;"></span>
            <span id="topbar-brand-name"></span>
            <span style="font-size: 10px; color: var(--text-muted);">▾</span>
          </div>

          <!-- Búsqueda Global -->
          <div class="hide-on-mobile" style="position: relative; width: 280px;">
            <input type="text" id="topbar-global-search" class="form-control" placeholder="Buscar en Nexa... (Ctrl + K)" style="padding-left: 32px; font-size: 12px; cursor: pointer;" readonly>
            <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--text-light);">🔍</span>
          </div>
        </div>

        <div class="topbar-right">
          
          <!-- Botón Conmutador de Modo Oscuro / Claro (Apple Glass Style) -->
          <button class="btn-theme-toggle" id="btn-theme-toggle" title="Alternar Modo Oscuro / Claro" aria-label="Modo Oscuro">
            <span id="theme-toggle-icon">🌙</span>
          </button>

          <!-- Indicador de Turno de Caja -->
          <span class="badge badge-neutral hide-on-mobile" id="topbar-cash-badge">…</span>

          <!-- Estado del respaldo automático -->
          <button type="button" class="badge badge-neutral backup-badge" id="topbar-backup-badge" title="Respaldo automático">…</button>

          <!-- Botón de Acción Rápida POS -->
          <button class="quick-action-btn" id="btn-topbar-quick-sale">
            <span>⚡</span>
            <span class="hide-on-mobile">Venta POS</span>
          </button>

          <!-- Conmutador Rápido de Rol / Usuario Activo (Anti-Saturación RBAC) -->
          <div class="user-profile-badge" id="topbar-user-menu-btn" title="Clic para alternar rol o perfil de usuario">
            <div class="user-avatar" id="topbar-user-avatar"></div>
            <div class="user-details hide-on-mobile">
              <span class="user-name" id="topbar-user-name"></span>
              <span class="user-role" id="topbar-user-role"></span>
            </div>
          </div>

        </div>

      </header>

      <!-- BARRA PERMANENTE DE SUB-MÓDULOS POR MACRO-CATEGORÍA -->
      <div id="macro-subnav-bar" style="padding: 12px 24px 0 24px;"></div>

      <!-- CONTENEDOR DINÁMICO DE VISTAS MODULARES SPA -->
      <div class="app-content" id="view-container">
        <div id="boot-status" style="padding: 40px; text-align: center; color: var(--text-muted, #94a3b8); font-size: 14px;">Cargando NexaAdmin…</div>
      </div>

    </main>

  </div>

  <!-- Mensajes de arranque: si algo falla, se ve en pantalla (antes quedaba en blanco) -->
  <script>
    (function () {
      function box(title, detail, isError) {
        var html = '<div style="max-width:640px;margin:60px auto;padding:24px;border-radius:12px;font-family:system-ui,sans-serif;' +
          'background:' + (isError ? '#fef2f2' : '#fffbeb') + ';border:1px solid ' + (isError ? '#f87171' : '#f59e0b') + ';color:#1f2937;">' +
          '<h2 style="margin:0 0 8px 0;font-size:18px;">' + title + '</h2>' +
          '<p style="margin:0;font-size:14px;line-height:1.5;">' + String(detail).replace(/</g, '&lt;') + '</p></div>';
        var c = document.getElementById('view-container');
        if (c) c.innerHTML = html; else document.body.innerHTML = html;
      }
      window.__nexaBootMessage = box;
      window.__nexaBootDone = function () { clearTimeout(window.__nexaBootTimer); };
      window.__nexaBootTimer = setTimeout(function () {
        if (!window.__nexaReady) box('NexaAdmin no terminó de cargar',
          'Último paso alcanzado: «' + (window.__nexaLastStep || 'ninguno (el programa no arrancó)') + '». Posibles causas: 1) hay otra pestaña de NexaAdmin abierta (ciérrela y recargue con F5); ' +
          '2) el navegador bloquea el almacenamiento local para archivos (en Brave: icono del león → desactive los escudos para esta página); ' +
          '3) falta el archivo js/bundle.js. Presione F12 → Consola para ver el detalle.', true);
      }, 12000);
    })();
  </script>
  <script src="js/bundle.js" onerror="window.__nexaBootMessage('No se pudo cargar js/bundle.js', 'Verifique que la carpeta js contiene bundle.js y que abrió el index.html de la carpeta correcta.', true)"></script>

  <!-- PWA: Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js')
          .then(function(reg) {
            console.log('[NexaAdmin] Service Worker registrado OK:', reg.scope);
            reg.onupdatefound = function() {
              var sw = reg.installing;
              sw.onstatechange = function() {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[NexaAdmin] Nueva versión instalada; se aplicará al recargar.');
                }
              };
            };
          })
          .catch(function(err) {
            // Normal cuando se abre como file:/// — funciona con HTTPS (GitHub Pages)
            console.warn('[NexaAdmin] SW no disponible en file:// (usa GitHub Pages para instalar):', err.message);
          });
      });
    }
  </script>

</body>
</html>
